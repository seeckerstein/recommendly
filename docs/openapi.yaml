openapi: 3.1.0
info:
  title: Recommendation Network API
  version: 0.1.0
  description: Caller-scoped API. All endpoints require Supabase bearer authentication.
servers:
  - url: /functions/v1/api
paths:
  /v1/recommendations:
    get:
      summary: Search recommendations authorized for the caller
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [book, movie, restaurant] }
        - in: query
          name: q
          schema: { type: string }
      responses: { "200": { description: Authorized recommendations } }
    post:
      summary: Create a recommendation
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecommendation"
      responses: { "201": { description: Created } }
  /v1/recommendations/{id}/recommend:
    post:
      summary: Create an independent re-recommendation
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
      responses: { "201": { description: Created } }
components:
  parameters:
    RecommendationId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CreateRecommendation:
      type: object
      required: [category, comment]
      properties:
        category: { type: string, enum: [book, movie, restaurant] }
        comment: { type: string, minLength: 1 }
        title: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
